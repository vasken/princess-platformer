        // Trail styling carries progress: walked ground is a solid ribbon, the
        // stretch you have not earned yet is only a dotted survey line.
        function drawLevelSelectPathSegment(a, b, walked) {
          const pad = 80;
          if (
            (a.x < -pad && b.x < -pad) ||
            (a.x > W + pad && b.x > W + pad) ||
            (a.y < -pad && b.y < -pad) ||
            (a.y > H + pad && b.y > H + pad)
          ) {
            return;
          }
          ctx.save();
          ctx.lineCap = "round";
          ctx.lineJoin = "round";

          ctx.strokeStyle = LS_THEME.trailShadow;
          ctx.lineWidth = walked ? 30 : 24;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y + 5);
          ctx.lineTo(b.x, b.y + 5);
          ctx.stroke();

          ctx.strokeStyle = walked ? LS_THEME.trailEdge : LS_THEME.trailEdgeCold;
          ctx.lineWidth = walked ? 28 : 22;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();

          ctx.strokeStyle = walked ? LS_THEME.trailFill : LS_THEME.trailFillCold;
          ctx.lineWidth = walked ? 22 : 16;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();

          if (walked) {
            ctx.setLineDash([6, 10]);
            ctx.strokeStyle = LS_THEME.trailDust;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
          ctx.restore();
        }

        function drawLevelSelectPath() {
          const first = Math.max(0, levelSelectIndex - 8);
          const last = Math.min(LEVELS.length - 1, levelSelectIndex + 8);
          for (let i = first; i < last; i++) {
            const a = levelGridPoint(i);
            const b = levelGridPoint(i + 1);
            drawLevelSelectPathSegment(
              isoToScreen(a.gx, a.gy, 0),
              isoToScreen(b.gx, b.gy, 0),
              i + 1 <= maxLevelUnlocked,
            );
          }
        }

        function levelState(index) {
          if (index > maxLevelUnlocked) return "locked";
          if (index === levelSelectIndex) return "selected";
          if (index < maxLevelUnlocked) return "completed";
          return "available";
        }

        function addDecorItem(items, frame, gx, gy, w, anchorY = 1) {
          const world = isoToWorld(gx, gy);
          items.push({
            kind: "decor",
            sort: world.y,
            draw() {
              const s = worldToScreen(world.x, world.y);
              lsDrawAtlasFrame(
                frame,
                s.x,
                s.y,
                w,
                anchorY,
                1,
                "saturate(0.9) contrast(1.02) brightness(0.92)",
              );
            },
          });
        }

        // Slots are offset far enough sideways that nothing drawn in front of a
        // stump can cover its number.
        const LS_DECOR_SLOTS = {
          backLeft: [-1.7, 0.3],
          backRight: [0.3, -1.7],
          frontRight: [1.8, 0.2],
          frontLeft: [0.2, 1.8],
          farRight: [2.2, -0.5],
          farLeft: [-0.5, 2.2],
        };

        function addSlotDecor(items, index, frame, slot, w) {
          const p = levelGridPoint(index);
          const off = LS_DECOR_SLOTS[slot];
          addDecorItem(items, frame, p.gx + off[0], p.gy + off[1], w);
        }

        function addLevelDecor(items, index) {
          const rota = [
            ["pineTree", "backLeft", 74],
            ["bushBerry", "frontRight", 54],
            ["rocks", "backRight", 76],
            ["flowerBush", "frontLeft", 56],
            ["log", "farLeft", 62],
            ["bushWhite", "farRight", 56],
          ];
          const a = rota[index % rota.length];
          const b = rota[(index * 3 + 2) % rota.length];
          addSlotDecor(items, index, a[0], a[1], a[2]);
          if (b[1] !== a[1]) addSlotDecor(items, index, b[0], b[1], b[2]);
          if (index === 0) addSlotDecor(items, 0, "cabin", "backLeft", 124);
          if (index % 5 === 3) addSlotDecor(items, index, "pond", "backRight", 116);
          if (index % 4 === 2) addSlotDecor(items, index, "lantern", "farRight", 40);
        }

        function drawFallbackNode(index, s, state) {
          const locked = state === "locked";
          const selected = state === "selected";
          const size = 58;
          ctx.save();
          ctx.translate(s.x, s.y);
          ctx.fillStyle = "rgba(0,0,0,0.26)";
          ctx.beginPath();
          ctx.ellipse(0, 23, 31, 9, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = locked
            ? "#8d8677"
            : selected
              ? "#f2b25e"
              : LS_THEME.nodeWood;
          ctx.strokeStyle = locked ? "#5d574d" : LS_THEME.nodeBark;
          ctx.lineWidth = selected ? 4 : 3;
          ctx.beginPath();
          ctx.ellipse(0, 0, size / 2, size / 3, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        }

        function drawLevelSelectNode(index) {
          const p = levelGridPoint(index);
          const s = isoToScreen(p.gx, p.gy);
          const state = levelState(index);
          const locked = state === "locked";
          const completed = state === "completed";
          const selected = state === "selected";
          const spriteName = locked
            ? "stoneBlock"
            : selected
              ? "stumpGold"
              : "stumpDefault";
          const dispW = LS_MAP.nodeW;

          levelSelectHitAreas.push({ index, x: s.x, y: s.y, r: 58 });

          if (selected) {
            const pulse = lsReduceMotion ? 0.35 : (renderTick % 84) / 84;
            ctx.save();
            ctx.globalAlpha = 0.55 * (1 - pulse);
            ctx.strokeStyle = LS_THEME.royal;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.ellipse(
              s.x,
              s.y + 10,
              dispW * (0.34 + 0.22 * pulse),
              dispW * (0.17 + 0.11 * pulse),
              0,
              0,
              Math.PI * 2,
            );
            ctx.stroke();
            ctx.globalAlpha = 0.3;
            ctx.fillStyle = LS_THEME.royal;
            ctx.beginPath();
            ctx.ellipse(s.x, s.y + 10, dispW * 0.34, dispW * 0.17, 0, 0, 6.29);
            ctx.fill();
            ctx.restore();
          }

          const placed = lsDrawAtlasFrame(
            spriteName,
            s.x,
            s.y,
            dispW,
            0.35,
            1,
            locked
              ? "saturate(0.5) brightness(0.9) contrast(0.98)"
              : "saturate(0.95) contrast(1.02) brightness(1)",
          );
          if (!placed) drawFallbackNode(index, s, state);
          const dh = placed ? placed.dh : dispW * 0.85;

          if (!selected) {
            pxText(String(index + 1), s.x, s.y + 2, 3, LS_THEME.cream, {
              align: "center",
              outline: locked ? "rgba(20,12,8,0.75)" : LS_THEME.ink,
            });
          }

          if (completed) {
            const bx = Math.round(s.x + dispW * 0.3);
            const by = Math.round(s.y - dh * 0.12);
            ctx.fillStyle = LS_THEME.royalDark;
            ctx.beginPath();
            ctx.arc(bx, by, 14, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = LS_THEME.royal;
            ctx.beginPath();
            ctx.arc(bx, by - 1, 13, 0, Math.PI * 2);
            ctx.fill();
            pxIcon(PX_CROWN, bx - 7, by - 5, 3, LS_THEME.goldDark);
            pxIcon(PX_CROWN, bx - 7, by - 6, 3, LS_THEME.gold);
          }

          if (locked) {
            const bx = Math.round(s.x + dispW * 0.3);
            const by = Math.round(s.y - dh * 0.12);
            ctx.fillStyle = "rgba(16,9,28,0.78)";
            ctx.beginPath();
            ctx.arc(bx, by, 14, 0, Math.PI * 2);
            ctx.fill();
            pxIcon(PX_LOCK, bx - 7, by - 8, 3, "#D8CFBB");
          }
        }

        // The marker is the princess herself: she stands on the level you have
        // chosen and hops along the trail to the next one when you choose again.
        const lsWalker = {
          from: null,
          to: null,
          t: 1,
          facing: 1,
        };

        function lsWalkerPoint() {
          const to = lsWalker.to == null ? levelSelectIndex : lsWalker.to;
          const from = lsWalker.from == null ? to : lsWalker.from;
          if (lsWalker.t >= 1 || from === to) {
            const p = levelGridPoint(to);
            return { s: isoToScreen(p.gx, p.gy), hop: 0 };
          }
          const steps = Math.abs(to - from);
          const travelled = lsWalker.t * steps;
          const leg = Math.min(steps - 1, Math.floor(travelled));
          const legT = travelled - leg;
          const dir = to > from ? 1 : -1;
          const a = levelGridPoint(from + leg * dir);
          const b = levelGridPoint(from + (leg + 1) * dir);
          const sa = isoToScreen(a.gx, a.gy);
          const sb = isoToScreen(b.gx, b.gy);
          return {
            s: {
              x: sa.x + (sb.x - sa.x) * legT,
              y: sa.y + (sb.y - sa.y) * legT,
            },
            hop: Math.sin(legT * Math.PI) * 26,
          };
        }

        function drawLevelSelectWalker() {
          if (lsWalker.to !== levelSelectIndex) {
            lsWalker.from = lsWalker.to == null ? levelSelectIndex : lsWalker.to;
            lsWalker.to = levelSelectIndex;
            lsWalker.t = 0;
            const a = levelGridPoint(lsWalker.from);
            const b = levelGridPoint(lsWalker.to);
            lsWalker.facing =
              isoToScreen(b.gx, b.gy).x >= isoToScreen(a.gx, a.gy).x ? 1 : -1;
          }
          if (lsWalker.t < 1) {
            const steps = Math.max(1, Math.abs(lsWalker.to - lsWalker.from));
            lsWalker.t = lsReduceMotion
              ? 1
              : Math.min(1, lsWalker.t + 0.055 / steps);
          }

          const { s, hop } = lsWalkerPoint();
          const idle =
            lsWalker.t >= 1 && !lsReduceMotion
              ? Math.sin(renderTick * 0.09) * 2.5
              : 0;
          const h = 86;
          const w = h * 0.5;
          const feetY = s.y - 8 - hop + idle;

          ctx.save();
          ctx.fillStyle = "rgba(10,5,20,0.35)";
          ctx.beginPath();
          ctx.ellipse(
            s.x,
            s.y + 2,
            18 - hop * 0.25,
            6 - hop * 0.08,
            0,
            0,
            Math.PI * 2,
          );
          ctx.fill();
          ctx.restore();

          if (!playerSpriteReady) return;
          ctx.save();
          ctx.imageSmoothingEnabled = false;
          if (lsWalker.facing < 0) {
            ctx.translate(s.x + w / 2, feetY - h);
            ctx.scale(-1, 1);
            ctx.drawImage(playerSprite, 0, 0, w, h);
          } else {
            ctx.drawImage(playerSprite, s.x - w / 2, feetY - h, w, h);
          }
          ctx.restore();
        }

        function buildVisibleMapItems() {
          const items = [];
          const first = Math.max(0, levelSelectIndex - 8);
          const last = Math.min(LEVELS.length - 1, levelSelectIndex + 8);
          for (let i = first; i <= last; i++) {
            addLevelDecor(items, i);
            const world = levelWorldPoint(i);
            items.push({
              kind: "node",
              sort: world.y + 20,
              draw() {
                drawLevelSelectNode(i);
              },
            });
          }
          return items.sort((a, b) => a.sort - b.sort);
        }

        // Progress pips repeat the map's three states (cleared, open, locked) so
        // the header answers "how far along am I" without a second vocabulary.
        function drawProgressPips(rightX, y) {
          const size = 10,
            gap = 7;
          const total = LEVELS.length;
          if (total > 16) {
            const barW = 168,
              barH = 10;
            const bx = rightX - barW;
            ctx.fillStyle = "rgba(255,243,214,0.22)";
            ctx.fillRect(bx, y, barW, barH);
            ctx.fillStyle = LS_THEME.gold;
            ctx.fillRect(
              bx,
              y,
              Math.round((barW * maxLevelUnlocked) / total),
              barH,
            );
            ctx.fillStyle = LS_THEME.cream;
            ctx.fillRect(
              bx + Math.round((barW * maxLevelUnlocked) / total) - 2,
              y - 2,
              4,
              barH + 4,
            );
            return;
          }
          const width = total * size + (total - 1) * gap;
          let x = rightX - width;
          for (let i = 0; i < total; i++) {
            const cx = x + size / 2;
            const cy = y + size / 2;
            ctx.beginPath();
            ctx.moveTo(cx, cy - size / 2);
            ctx.lineTo(cx + size / 2, cy);
            ctx.lineTo(cx, cy + size / 2);
            ctx.lineTo(cx - size / 2, cy);
            ctx.closePath();
            if (i < maxLevelUnlocked) {
              ctx.fillStyle = LS_THEME.gold;
              ctx.fill();
            } else if (i === maxLevelUnlocked) {
              ctx.fillStyle = LS_THEME.cream;
              ctx.fill();
            } else {
              ctx.strokeStyle = "rgba(255,243,214,0.35)";
              ctx.lineWidth = 2;
              ctx.stroke();
            }
            x += size + gap;
          }
        }

        function drawLevelSelectUi() {
          const level = LEVELS[levelSelectIndex] || {};
          const name = (level.name || "LEVEL " + (levelSelectIndex + 1))
            .toString()
            .toUpperCase();
          const wordmark = "JUMPING QUINN";
          const cardW = pxWidth(wordmark, 4) + 74;
          const cardH = 54;
          lsPlaque(
            22,
            20,
            cardW,
            cardH,
            LS_THEME.parchment,
            LS_THEME.parchmentDark,
          );
          pxIcon(PX_CROWN, 40, 43, 4, LS_THEME.goldDark);
          pxIcon(PX_CROWN, 40, 41, 4, LS_THEME.gold);
          pxText(wordmark, 76, 33, 4, LS_THEME.ink);

          drawProgressPips(W - 26, 30);
          pxText(
            maxLevelUnlocked + "/" + LEVELS.length + " CROWNS",
            W - 26,
            48,
            2,
            LS_THEME.creamDim,
            { align: "right" },
          );

          const label = "PLAY " + name;
          const btnW = pxWidth(label, 3) + 56;
          const btnH = 52;
          const btnX = Math.round((W - btnW) / 2);
          const btnY = H - 88;
          levelSelectPlayArea = { x: btnX, y: btnY, w: btnW, h: btnH };
          pxText(
            "LEVEL " + (levelSelectIndex + 1) + " OF " + LEVELS.length,
            W / 2,
            btnY - 20,
            2,
            LS_THEME.creamDim,
            { align: "center" },
          );
          lsPlaque(btnX, btnY, btnW, btnH, LS_THEME.royal, LS_THEME.gold);
          ctx.fillStyle = "rgba(255,255,255,0.16)";
          ctx.fillRect(btnX + 3, btnY + 3, btnW - 6, 10);
          pxText(label, W / 2, btnY + 17, 3, LS_THEME.cream, {
            align: "center",
            shadow: LS_THEME.royalDark,
          });

          ctx.save();
          ctx.fillStyle = LS_THEME.creamDim;
          ctx.font = 'bold 11px "Courier New", monospace';
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          if (ctx.letterSpacing !== undefined) ctx.letterSpacing = "3px";
          ctx.fillText(
            viewport.touch
              ? "TAP A STUMP TO PLAY  ·  DRAG TO LOOK AROUND"
              : "← →  CHOOSE     ENTER  PLAY     DRAG  LOOK AROUND",
            W / 2,
            H - 20,
          );
          ctx.restore();
          ctx.textAlign = "start";
          ctx.textBaseline = "top";
        }

        function drawLevelSelect() {
          levelSelectHitAreas = [];
          levelSelectPlayArea = null;
          if (!levelSelectCamera.initialized) centerLevelSelectCamera(true);

          drawLevelSelectSky();
          drawLevelSelectGround();
          drawLevelSelectPath();

          const items = buildVisibleMapItems();
          for (const item of items) item.draw();
          drawLevelSelectWalker();
          drawLevelSelectVignette();
          drawLevelSelectUi();
        }

        function drawRotateOverlay() {
          ctx.fillStyle = "rgba(0,0,0,0.82)";
          ctx.fillRect(0, 0, W, H);
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          pxText("TURN SIDEWAYS", W / 2, H / 2 - 72, 6, LS_THEME.gold, {
            align: "center",
            shadow: "rgba(20,10,28,0.85)",
            shadowOffset: 3,
          });
          ctx.fillStyle = "#FFFFFF";
          ctx.font = 'bold 24px "Courier New", monospace';
          ctx.fillText("Quinn jumps best in landscape.", W / 2, H / 2 + 10);
          ctx.font = 'bold 18px "Courier New", monospace';
          ctx.fillText(
            "Turn your device to continue.",
            W / 2,
            H / 2 + 50,
          );
          ctx.textAlign = "start";
          ctx.textBaseline = "top";
        }

        let renderTick = 0;
        function syncCanvasPresentation() {
          const imageRendering =
            GameState.current === "LEVEL_SELECT" && forestSheetReady
              ? "auto"
              : "pixelated";
          if (canvas.style.imageRendering !== imageRendering) {
            canvas.style.imageRendering = imageRendering;
          }
        }

        function render() {
          syncCanvasPresentation();

          if (GameState.current === "LEVEL_SELECT") {
            drawLevelSelect();
            if (viewport.phonePortrait) drawRotateOverlay();
            renderTick++;
            return;
          }

          // Apply screen shake as a canvas translate for this frame only.
          let ox = 0,
            oy = 0;
          if (shakeFrames > 0) {
            ox = (Math.random() * 2 - 1) * shakeMag;
            oy = (Math.random() * 2 - 1) * shakeMag;
          }
          ctx.save();
          ctx.translate(ox, oy);

          drawBackground();
          if (level.decorations) {
            for (const d of level.decorations) {
              const dx = d.x - cam.x,
                dy = d.y - cam.y;
              if (dx + d.w < 0 || dx > W) continue;
              drawShrub(dx, dy, d.w, d.h, d.color);
            }
          }
          for (const p of platforms) drawPlatform(p);
          drawGoal();
          for (const pk of level.pickups) drawPickup(pk, renderTick);
          for (const e of level.enemies) drawEnemy(e);
          drawPlayer();
          drawParticles();

          ctx.restore();
          drawHud(); // HUD stays fixed (no shake)
          if (viewport.phonePortrait) drawRotateOverlay();
          renderTick++;
        }

        // ---------- GAME LOOP (fixed 60Hz physics, variable render) ----------
        const TICK_MS = 1000 / 60;
        let lastTime = 0;
        let accumulator = 0;

        function frame(now) {
          if (!lastTime) lastTime = now;
          accumulator += now - lastTime;
          lastTime = now;

          if (accumulator > TICK_MS * 10) accumulator = TICK_MS * 10;

          if (viewport.phonePortrait) {
            accumulator = 0;
            clearPressedInputs();
            render();
            requestAnimationFrame(frame);
            return;
          }

          while (accumulator >= TICK_MS) {
            update();
            // The adventure map owns its own camera and can be the initial screen,
            // before a platforming level has been loaded.
            if (level && GameState.current !== "LEVEL_SELECT") updateCamera();
            advanceTouchState();
            clearPressedInputs();
            accumulator -= TICK_MS;
          }

          render();
          requestAnimationFrame(frame);
        }

        // Editor playtest links keep their direct-to-level behavior. Normal visits
        // start on the adventure map with the furthest unlocked level selected.
        if (hasPlaytestLevel()) GameState.transitionTo("PLAY");
        else GameState.transitionTo("LEVEL_SELECT");
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
