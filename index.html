<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <title>Jumping Quinn</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        font-family: "Courier New", monospace;
        overflow: hidden;
        overscroll-behavior: none;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* Letterbox: preserve 16:9, scale to fit viewport, crisp pixels. */
      canvas {
        background: #5fcde4;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        max-width: 100vw;
        max-height: 100vh;
        aspect-ratio: 16 / 9;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="960" height="540"></canvas>
    <script src="levels.js"></script>
    <script>
      (() => {
        "use strict";

        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        const W = canvas.width,
          H = canvas.height;
        const playerSprite = new Image();
        let playerSpriteReady = false;
        playerSprite.onload = () => {
          playerSpriteReady = true;
        };
        playerSprite.src = "assets/princess-main.png";

        // Isometric forest assets used by the level-select map.
        // Bboxes are tight per-sprite; the sheet's bottom rows pack sprites of
        // varying widths so the layout is not a uniform grid.
        const forestSheet = new Image();
        let forestSheetReady = false;
        forestSheet.onload = () => {
          forestSheetReady = true;
        };
        forestSheet.src =
          "assets/isometric_forest_puzzle_assets_sheet_transparent.png";
        const FOREST_ATLAS = {
          grass: { sx: 31, sy: 47, sw: 204, sh: 149 }, // green grass tile
          grassDark: { sx: 260, sy: 47, sw: 204, sh: 149 }, // dark grass tile
          grassFlowers: { sx: 710, sy: 47, sw: 204, sh: 149 }, // flower grass tile
          pond: { sx: 710, sy: 213, sw: 201, sh: 152 }, // pond with reeds
          stumpDefault: { sx: 34, sy: 839, sw: 181, sh: 154 }, // plain stump (completed node)
          stumpGrass: { sx: 34, sy: 1008, sw: 181, sh: 154 }, // gold stump
          stumpGold: { sx: 476, sy: 1008, sw: 185, sh: 154 }, // glowing stump (current node)
          stoneBlock: { sx: 703, sy: 1008, sw: 182, sh: 154 }, // grey stone (locked node)
          cabin: { sx: 28, sy: 1175, sw: 220, sh: 155 }, // log cabin
          treeApple: { sx: 606, sy: 1175, sw: 122, sh: 155 }, // small deciduous tree
          bushWhite: { sx: 762, sy: 1175, sw: 123, sh: 155 }, // white-flower bush
          rocks: { sx: 20, sy: 1335, sw: 180, sh: 160 }, // rock pile
          flowerBush: { sx: 200, sy: 1335, sw: 123, sh: 160 }, // pink/white flower bush
          bushBerry: { sx: 347, sy: 1335, sw: 126, sh: 160 }, // red berry bush
          pineTree: { sx: 502, sy: 1335, sw: 119, sh: 160 }, // pine tree
          log: { sx: 631, sy: 1335, sw: 127, sh: 160 }, // wooden log
          fence: { sx: 784, sy: 1335, sw: 126, sh: 160 }, // fence section
          lantern: { sx: 67, sy: 1500, sw: 78, sh: 160 }, // lantern post
        };

        // ---------- PALETTE (storybook meadow) ----------
        // Warm daylight over green country. The old purple survives only as the
        // haze on the far castle, which keeps the distance feeling like distance.
        const COLORS = {
          skyTop: "#8FD3EF",
          skyMid: "#C6E9F4",
          skyLow: "#FBE7C0",
          sun: "rgba(255,238,180,0.75)",
          cloud: "#FFFFFF",
          cloudShade: "#DCEBF3",
          castle: "#BDB6D8",
          castleDark: "#A69ECA",
          hillFar: "#A9C9A0",
          hillNear: "#6FA85C",
          rock: "#8A5A33",
          rockDark: "#5E3A20",
          rockLip: "#A87A4A",
          grass: "#7BCB55",
          grassDark: "#4A9A34",
          plank: "#B07A44",
          plankDark: "#7A5028",
          playerShirt: "#E8368F",
          playerPants: "#C21E6B",
          playerHelmet: "#FFC531",
          goalPole: "#8A5A33",
          goalFlagA: "#E8368F",
          goalFlagB: "#FFC531",
          parchment: "#F6E6BE",
          parchmentEdge: "#D9BF8C",
          ink: "#3A2412",
          inkSoft: "#8A6A3A",
          hudText: "#FFF3D6",
          bramble: "#16281A",
          pitBand: "#2E1F16",
          pitSpike: "#16281A",
          coin: "#FFC531",
          coinDark: "#C68A12",
          enemyBody: "#D6453F",
          enemyDark: "#9E2B27",
          enemyFoot: "#F3E4C8",
          dust: "#EADFCB",
        };
        let skyGradient = null;

        // ---------- INPUT ----------
        // `keys` = keyboard-held. `pressed` = keyboard edge-triggered, cleared each tick.
        const keys = Object.create(null);
        const pressed = Object.create(null);
        const touchHeld = {
          left: false,
          right: false,
          down: false,
          jump: false,
        };
        const touchPressed = Object.create(null);
        const activePointers = new Map();
        const coarsePointerQuery = window.matchMedia
          ? window.matchMedia("(pointer: coarse)")
          : null;
        const viewport = {
          touch: false,
          smallScreen: false,
          phonePortrait: false,
        };
        const TOUCH = {
          leftZoneRatio: 0.5,
          moveDeadzonePx: 24,
          verticalDeadzonePx: 28,
          swipeJumpPx: 26,
          swipeDropPx: 34,
          tapJumpMs: 220,
          tapJumpHoldFrames: 12,
          pauseZonePx: 88,
          phoneMinSideMax: 820,
        };
        let touchJumpHoldFrames = 0;

        const BLOCKED = new Set([
          "ArrowLeft",
          "ArrowRight",
          "ArrowUp",
          "ArrowDown",
          "Space",
          "KeyW",
          "KeyA",
          "KeyS",
          "KeyD",
          "Escape",
          "KeyP",
          "KeyR",
          "KeyQ",
          "Enter",
        ]);
        window.addEventListener("keydown", (e) => {
          if (BLOCKED.has(e.code)) e.preventDefault();
          // Unlock audio inside a real user gesture (browsers require this).
          Sfx.unlock();
          if (!keys[e.code]) pressed[e.code] = true;
          keys[e.code] = true;
        });
        window.addEventListener("keyup", (e) => {
          keys[e.code] = false;
        });
        window.addEventListener("blur", () => {
          clearAllInputs();
        });

        function clearTouchDirectionalState() {
          touchHeld.left = false;
          touchHeld.right = false;
          touchHeld.down = false;
        }

        function clearTouchInputs() {
          clearTouchDirectionalState();
          touchHeld.jump = false;
          touchJumpHoldFrames = 0;
          activePointers.clear();
          for (const k in touchPressed) delete touchPressed[k];
        }

        function clearAllInputs() {
          for (const k in keys) keys[k] = false;
          for (const k in pressed) delete pressed[k];
          clearTouchInputs();
        }

        function syncViewportState() {
          const coarse = coarsePointerQuery
            ? coarsePointerQuery.matches
            : false;
          viewport.touch =
            coarse || navigator.maxTouchPoints > 0 || "ontouchstart" in window;
          viewport.smallScreen =
            Math.min(window.innerWidth, window.innerHeight) <=
            TOUCH.phoneMinSideMax;
          viewport.phonePortrait =
            viewport.touch &&
            viewport.smallScreen &&
            window.innerHeight > window.innerWidth;
          if (viewport.phonePortrait) clearTouchInputs();
        }

        function canvasPointFromEvent(e) {
          const rect = canvas.getBoundingClientRect();
          const scaleX = rect.width > 0 ? W / rect.width : 1;
          const scaleY = rect.height > 0 ? H / rect.height : 1;
          return {
            x: (e.clientX - rect.left) * scaleX,
            y: (e.clientY - rect.top) * scaleY,
            rect,
          };
        }

        function isPauseZone(point) {
          return (
            point.x >= W - TOUCH.pauseZonePx && point.y <= TOUCH.pauseZonePx
          );
        }

        function isTouchPointer(e) {
          return e.pointerType === "touch" || e.pointerType === "pen";
        }

        function refreshActionJumpState() {
          touchHeld.jump = touchJumpHoldFrames > 0;
          for (const state of activePointers.values()) {
            if (state.role === "action" && state.jumpHeld) {
              touchHeld.jump = true;
              break;
            }
          }
        }

        function fireTouchJump(state = null) {
          touchPressed.jump = true;
          touchHeld.jump = true;
          if (state) {
            state.jumpHeld = true;
            touchJumpHoldFrames = 0;
            return;
          }
          touchJumpHoldFrames = TOUCH.tapJumpHoldFrames;
        }

        function fireTouchPause() {
          touchPressed.pause = true;
        }

        function fireTouchConfirm() {
          touchPressed.confirm = true;
        }

        function fireTouchDrop() {
          touchPressed.drop = true;
        }

        function refreshMovePointerState() {
          clearTouchDirectionalState();
          for (const state of activePointers.values()) {
            if (state.role !== "move") continue;
            const dx = state.x - state.startX;
            const dy = state.y - state.startY;
            if (
              Math.abs(dx) >= TOUCH.moveDeadzonePx &&
              Math.abs(dx) >= Math.abs(dy) * 0.85
            ) {
              if (dx < 0) touchHeld.left = true;
              if (dx > 0) touchHeld.right = true;
            } else if (
              dy >= TOUCH.verticalDeadzonePx &&
              Math.abs(dy) > Math.abs(dx)
            ) {
              touchHeld.down = true;
            }
          }
        }

        function handleActionGesture(state) {
          if (state.consumed) return;
          const dx = state.x - state.startX;
          const dy = state.y - state.startY;
          if (dy <= -TOUCH.swipeJumpPx && Math.abs(dy) >= Math.abs(dx) * 0.8) {
            fireTouchJump(state);
            state.consumed = true;
          } else if (
            dy >= TOUCH.swipeDropPx &&
            Math.abs(dy) >= Math.abs(dx) * 0.8
          ) {
            fireTouchDrop();
            state.consumed = true;
          }
        }

        function finishTouchPointer(e) {
          const state = activePointers.get(e.pointerId);
          if (!state) return;
          if (state.role === "level-select") {
            finishLevelSelectPointer(state);
            activePointers.delete(e.pointerId);
            refreshMovePointerState();
            refreshActionJumpState();
            return;
          }
          if (state.role === "action" && !state.consumed) {
            const duration = performance.now() - state.startedAt;
            if (duration <= TOUCH.tapJumpMs) fireTouchJump();
          }
          activePointers.delete(e.pointerId);
          refreshMovePointerState();
          refreshActionJumpState();
        }

        canvas.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          syncViewportState();
          Sfx.unlock();
          if (GameState.current === "DEAD" || GameState.current === "WIN") {
            fireTouchConfirm();
            return;
          }
          if (viewport.phonePortrait) return;
          const point = canvasPointFromEvent(e);
          if (GameState.current === "LEVEL_SELECT") {
            beginLevelSelectPointer(e, point);
            return;
          }
          if (!isTouchPointer(e)) return;
          if (isPauseZone(point)) {
            fireTouchPause();
            return;
          }

          const role = point.x < W * TOUCH.leftZoneRatio ? "move" : "action";
          const state = {
            role,
            startX: point.x,
            startY: point.y,
            x: point.x,
            y: point.y,
            startedAt: performance.now(),
            consumed: false,
            jumpHeld: false,
          };
          activePointers.set(e.pointerId, state);
          canvas.setPointerCapture(e.pointerId);
          if (role === "move") refreshMovePointerState();
        });

        canvas.addEventListener("pointermove", (e) => {
          const state = activePointers.get(e.pointerId);
          if (!state) return;
          e.preventDefault();
          const point = canvasPointFromEvent(e);
          state.x = point.x;
          state.y = point.y;
          if (state.role === "level-select") updateLevelSelectPointer(state);
          else if (state.role === "move") refreshMovePointerState();
          else handleActionGesture(state);
        });

        function cancelPointer(e) {
          if (!activePointers.has(e.pointerId)) return;
          e.preventDefault();
          finishTouchPointer(e);
        }

        canvas.addEventListener("pointerup", cancelPointer);
        canvas.addEventListener("pointercancel", cancelPointer);
        canvas.addEventListener("pointerleave", (e) => {
          if (e.pointerType === "mouse") return;
          cancelPointer(e);
        });

        window.addEventListener("resize", syncViewportState);
        window.addEventListener("orientationchange", syncViewportState);
        if (coarsePointerQuery && coarsePointerQuery.addEventListener) {
          coarsePointerQuery.addEventListener("change", syncViewportState);
        }
        syncViewportState();

        const isLeft = () =>
          keys["ArrowLeft"] || keys["KeyA"] || touchHeld.left;
        const isRight = () =>
          keys["ArrowRight"] || keys["KeyD"] || touchHeld.right;
        const isDown = () =>
          keys["ArrowDown"] || keys["KeyS"] || touchHeld.down;
        const jumpPressedNow = () =>
          pressed["Space"] ||
          pressed["ArrowUp"] ||
          pressed["KeyW"] ||
          touchPressed.jump;
        const jumpHeld = () =>
          keys["Space"] || keys["ArrowUp"] || keys["KeyW"] || touchHeld.jump;
        const pausePressedNow = () =>
          pressed["Escape"] || pressed["KeyP"] || touchPressed.pause;
        const confirmPressedNow = () =>
          pressed["KeyR"] ||
          pressed["Space"] ||
          pressed["Enter"] ||
          touchPressed.confirm ||
          touchPressed.jump;
        const dropPressedNow = () => touchPressed.drop;
        const quitPressedNow = () => pressed["KeyQ"];
        const leftPressedNow = () => pressed["ArrowLeft"] || pressed["KeyA"];
        const rightPressedNow = () => pressed["ArrowRight"] || pressed["KeyD"];

        function clearPressedInputs() {
          for (const k in pressed) delete pressed[k];
          for (const k in touchPressed) delete touchPressed[k];
        }

        function advanceTouchState() {
          if (touchJumpHoldFrames > 0) {
            touchJumpHoldFrames--;
          }
          refreshActionJumpState();
        }

        // ---------- AUDIO ----------
        // Tiny WebAudio synth. No assets. AudioContext is created lazily inside a
        // real user gesture (keydown) so browsers will actually let it run.
        const Sfx = (() => {
          let ac = null;
          let ready = false;

          function unlock() {
            if (ac) {
              if (ac.state === "suspended") ac.resume();
              return;
            }
            try {
              const AC = window.AudioContext || window.webkitAudioContext;
              if (!AC) return;
              ac = new AC();
              ready = true;
            } catch (_) {}
          }

          // Short pitched tone with linear attack and exponential decay.
          // If `freqEnd` != freq, sweeps between them exponentially.
          function tone(freq, freqEnd, dur, type = "square", gain = 0.08) {
            if (!ready) return;
            const t = ac.currentTime;
            const o = ac.createOscillator();
            const g = ac.createGain();
            o.type = type;
            o.frequency.setValueAtTime(freq, t);
            if (freqEnd && freqEnd !== freq) {
              o.frequency.exponentialRampToValueAtTime(
                Math.max(1, freqEnd),
                t + dur,
              );
            }
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(gain, t + 0.005);
            g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            o.connect(g).connect(ac.destination);
            o.start(t);
            o.stop(t + dur + 0.02);
          }

          // White noise burst for landings/impacts.
          function noise(dur, gain = 0.06) {
            if (!ready) return;
            const t = ac.currentTime;
            const len = Math.max(1, Math.floor(ac.sampleRate * dur));
            const buf = ac.createBuffer(1, len, ac.sampleRate);
            const d = buf.getChannelData(0);
            for (let i = 0; i < len; i++)
              d[i] = (Math.random() * 2 - 1) * (1 - i / len);
            const src = ac.createBufferSource();
            src.buffer = buf;
            const g = ac.createGain();
            g.gain.value = gain;
            src.connect(g).connect(ac.destination);
            src.start(t);
          }

          return {
            unlock,
            jump: () => tone(380, 720, 0.12, "square", 0.08),
            land: () => noise(0.06, 0.05),
            pickup: () => {
              tone(880, 880, 0.05, "square", 0.08);
              setTimeout(() => tone(1320, 1320, 0.08, "square", 0.08), 40);
            },
            stomp: () => tone(260, 110, 0.1, "square", 0.1),
            bonk: () => tone(180, 140, 0.06, "square", 0.06),
            death: () => tone(400, 60, 0.5, "sawtooth", 0.12),
            win: () => {
              [523, 659, 784, 1046].forEach((f, i) =>
                setTimeout(() => tone(f, f, 0.14, "square", 0.09), i * 90),
              );
            },
          };
        })();

        // ---------- TUNING ----------
        const GRAVITY = 0.6;
        const MAX_FALL = 14;
        const MOVE_ACCEL = 0.8;
        const AIR_ACCEL = 0.5;
        const MAX_RUN = 4.6;
        const FRICTION = 0.78;
        const AIR_FRICTION = 0.94;
        const JUMP_VELOCITY = -11.5; // v^2/(2g) ≈ 110px apex
        const JUMP_CUT = 0.45;
        const COYOTE_FRAMES = 7; // ~117ms
        const BUFFER_FRAMES = 7; // ~117ms
        const STOMP_BOUNCE = 0.7; // fraction of JUMP_VELOCITY given on stomp
        const DROP_FRAMES = 8; // ignore one-ways for this many ticks after drop-thru

        // ---------- LEVELS ----------
        // Defined in levels.js so the editor (editor.html) can load & save the same file.
        const LEVELS = window.LEVELS;

        const LEVEL_PROGRESS_KEY = "keenLike.levelProgress.v1";

        function readMaxLevelUnlocked() {
          try {
            const saved = Number.parseInt(
              localStorage.getItem(LEVEL_PROGRESS_KEY),
              10,
            );
            return Number.isFinite(saved)
              ? Math.max(0, Math.min(LEVELS.length - 1, saved))
              : 0;
          } catch (_) {
            return 0;
          }
        }

        function unlockThrough(index) {
          const unlocked = Math.max(0, Math.min(LEVELS.length - 1, index));
          if (unlocked <= maxLevelUnlocked) return;
          maxLevelUnlocked = unlocked;
          try {
            localStorage.setItem(LEVEL_PROGRESS_KEY, String(maxLevelUnlocked));
          } catch (_) {
            // Progress remains available for this session when storage is unavailable.
          }
        }

        let level, platforms, goal;
        let currentLevelIndex = 0;
        let maxLevelUnlocked = readMaxLevelUnlocked();
        let levelSelectIndex = maxLevelUnlocked;
        const levelSelectCamera = {
          x: 0,
          y: 0,
          targetX: 0,
          targetY: 0,
          initialized: false,
          dragging: false,
        };
        let levelSelectHitAreas = [];
        let levelSelectPlayArea = null;

        // Level-name banner that shows briefly after loading a level.
        let bannerFrames = 0;
        let bannerText = "";
        let bannerEyebrow = "";
        function showBanner(text, frames = 110) {
          bannerText = text;
          bannerFrames = frames;
        }

        // ---------- PLAYER ----------
        const player = {
          x: 80,
          y: 300,
          w: 26,
          h: 40,
          vx: 0,
          vy: 0,
          onGround: false,
          facing: 1,
          coyote: 0,
          buffer: 0,
          jumpCut: false,
          groundPlatform: null, // what we're standing on (for drop-through)
          dropThrough: 0, // frames remaining where one-ways are pass-through
          squashT: 0, // visual squash timer (landing)
          stretchT: 0, // visual stretch timer (jumping)
        };

        let score = 0;
        let maxX = player.x;

        // ---------- PARTICLES ----------
        // Lightweight dust/debris system. Short-lived, affected by gravity.
        const particles = [];
        function spawnDust(cx, cy, count = 7, color = COLORS.dust) {
          for (let i = 0; i < count; i++) {
            const a = Math.random() * Math.PI - Math.PI; // upward hemisphere
            const s = 0.8 + Math.random() * 1.6;
            particles.push({
              x: cx,
              y: cy,
              vx: Math.cos(a) * s,
              vy: Math.sin(a) * s - 0.5,
              life: 18 + ((Math.random() * 6) | 0),
              size: 2 + ((Math.random() * 2) | 0),
              color,
            });
          }
        }
        function updateParticles() {
          for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.18; // light gravity
            p.vx *= 0.96;
            p.life--;
            if (p.life <= 0) particles.splice(i, 1);
          }
        }

        // ---------- SCREEN SHAKE ----------
        let shakeFrames = 0;
        let shakeMag = 0;
        function shake(frames, mag) {
          if (frames > shakeFrames) shakeFrames = frames;
          if (mag > shakeMag) shakeMag = mag;
        }

        // ---------- STATE MACHINE ----------
        // PLAY <-> PAUSE, plus terminal DEAD/WIN states that await a keypress to reset.
        // LEVEL_SELECT shows between levels (and on manual quit) — its handler loads the
        // chosen level itself before transitioning to PLAY, so PLAY skips reset on that path.
        const GameState = {
          current: "BOOT",
          transitionTo(newState) {
            const prev = this.current;
            this.current = newState;
            switch (newState) {
              case "PLAY":
                // DEAD → retry current level (keep score).
                // LEVEL_SELECT → caller already loaded the chosen level; just resume.
                // PAUSE → just resume, no state change.
                // WIN or fresh boot → full reset from level 1.
                if (prev === "DEAD") retryLevel();
                else if (prev === "LEVEL_SELECT") {
                  /* caller handled load */
                } else if (prev !== "PAUSE") resetGame();
                break;
              case "DEAD":
                Sfx.death();
                shake(18, 8);
                spawnDust(
                  player.x + player.w / 2,
                  player.y + player.h,
                  14,
                  "#FF6666",
                );
                break;
              case "WIN":
                Sfx.win();
                break;
              case "PAUSE":
                break;
              case "LEVEL_SELECT":
                bannerFrames = 0;
                bannerText = "";
                shakeFrames = 0;
                shakeMag = 0;
                centerLevelSelectCamera(true);
                break;
            }
          },
        };

        function loadLevel(index) {
          // Deep-ish reset so replays don't see collected pickups / dead enemies.
          currentLevelIndex = index;
          const src = LEVELS[index];
          level = {
            ...src,
            pickups: src.pickups.map((p) => ({ ...p, taken: false })),
            enemies: src.enemies.map((e) => ({ ...e, alive: true })),
          };
          platforms = level.platforms;
          goal = level.goal;

          // Vertical camera bounds — auto-computed from platform geometry.
          const minPlatY = Math.min(...platforms.map((p) => p.y));
          level.camCeiling = minPlatY - 100;
          level.camFloor = level.deathY;

          bannerEyebrow = "LEVEL " + (index + 1) + " OF " + LEVELS.length;
          showBanner(level.name || "LEVEL " + (index + 1));
        }

        // Place the player at the current level's spawn and clear transient state.
        // Called on fresh start, retry, and level advance — so we don't repeat the
        // same position-reset in three places.
        function placePlayerAtSpawn() {
          player.x = level.spawn.x;
          player.y = level.spawn.y;
          player.vx = 0;
          player.vy = 0;
          player.onGround = false;
          player.coyote = 0;
          player.buffer = 0;
          player.jumpCut = false;
          player.groundPlatform = null;
          player.dropThrough = 0;
          player.squashT = 0;
          player.stretchT = 0;
          player.facing = 1;
          maxX = player.x;
          particles.length = 0;
          shakeFrames = 0;
          shakeMag = 0;
        }

        // Starting level: honour ?level=N from the URL (1-indexed for humans,
        // clamped to available levels) so the editor can jump straight to a
        // specific level for playtesting.
        function startingLevelIndex() {
          const n = parseInt(
            new URLSearchParams(location.search).get("level"),
            10,
          );
          if (!Number.isFinite(n)) return 0;
          return Math.max(0, Math.min(LEVELS.length - 1, n - 1));
        }

        function hasPlaytestLevel() {
          return new URLSearchParams(location.search).has("level");
        }

        // Fresh game: first level (or ?level=N), score 0.
        function resetGame() {
          loadLevel(startingLevelIndex());
          placePlayerAtSpawn();
          initCamera();
          score = 0;
        }

        // Retry current level after death: keep score, reload the level fresh.
        function retryLevel() {
          loadLevel(currentLevelIndex);
          placePlayerAtSpawn();
          initCamera();
        }

        // Advance to the next level (or trigger WIN if this was the last one).
        // Keeps the score running across levels. Routes through the LEVEL_SELECT screen
        // so the player picks the next level themselves; the next level is preselected
        // and unlocked here. Final level still goes straight to WIN.
        function advanceLevel() {
          if (currentLevelIndex + 1 < LEVELS.length) {
            const nextIndex = currentLevelIndex + 1;
            unlockThrough(nextIndex);
            levelSelectIndex = nextIndex;
            Sfx.pickup(); // light "level up" chime
            GameState.transitionTo("LEVEL_SELECT");
          } else {
            GameState.transitionTo("WIN");
          }
        }

        // ---------- COLLISION ----------
        function aabb(a, b) {
          return (
            a.x < b.x + b.w &&
            a.x + a.w > b.x &&
            a.y < b.y + b.h &&
            a.y + a.h > b.y
          );
        }

        // Axis-separated swept resolution.
        // Returns { landed, hitWall, hitCeiling } so callers can trigger FX.
        // Also sets player.groundPlatform to whatever we landed on (for drop-through).
        function moveAndCollide() {
          const result = { landed: false, hitWall: false, hitCeiling: false };

          // --- X axis (one-way platforms are pass-through on X) ---
          player.x += player.vx;
          for (const p of platforms) {
            if (p.type === "one-way") continue;
            if (aabb(player, p)) {
              if (player.vx > 0) player.x = p.x - player.w;
              else if (player.vx < 0) player.x = p.x + p.w;
              player.vx = 0;
              result.hitWall = true;
            }
          }

          // --- Y axis ---
          player.y += player.vy;
          let landed = false;
          let landedOn = null;
          for (const p of platforms) {
            if (p.type === "one-way") {
              // Skip one-ways entirely during drop-through grace frames.
              if (player.dropThrough > 0) continue;
              // Only collide when falling AND previous feet position was at or near
              // the platform top. The 6 px tolerance handles the edge case where the
              // player barely reaches a high platform — feet clip slightly below p.y
              // at apex, so without tolerance prevFeet > p.y and landing never fires.
              if (player.vy > 0 && player.y + player.h - player.vy <= p.y + 6) {
                if (aabb(player, p)) {
                  player.y = p.y - player.h;
                  player.vy = 0;
                  landed = true;
                  landedOn = p;
                  result.landed = true;
                }
              }
              continue;
            }
            if (aabb(player, p)) {
              if (player.vy > 0) {
                player.y = p.y - player.h;
                player.vy = 0;
                landed = true;
                landedOn = p;
                result.landed = true;
              } else if (player.vy < 0) {
                player.y = p.y + p.h;
                player.vy = 0;
                result.hitCeiling = true;
              }
            }
          }
          player.onGround = landed;
          player.groundPlatform = landedOn;
          return result;
        }

        // ---------- UPDATE ----------
        function update() {
          // Quit-to-level-select — works from PLAY or PAUSE, ignored elsewhere.
          if (
            quitPressedNow() &&
            (GameState.current === "PLAY" || GameState.current === "PAUSE")
          ) {
            // A ?level=N editor playtest may be ahead of normal saved progress.
            levelSelectIndex = Math.min(currentLevelIndex, maxLevelUnlocked);
            GameState.transitionTo("LEVEL_SELECT");
            return;
          }

          // Pause toggle — works from PLAY or PAUSE, ignored in DEAD/WIN/LEVEL_SELECT.
          if (pausePressedNow()) {
            if (GameState.current === "PLAY") GameState.transitionTo("PAUSE");
            else if (GameState.current === "PAUSE")
              GameState.transitionTo("PLAY");
          }

          if (GameState.current === "PAUSE") return;

          if (GameState.current === "LEVEL_SELECT") {
            const prevSelect = levelSelectIndex;
            if (leftPressedNow() && levelSelectIndex > 0) {
              levelSelectIndex--;
            } else if (
              rightPressedNow() &&
              levelSelectIndex < maxLevelUnlocked
            ) {
              levelSelectIndex++;
            }
            if (levelSelectIndex !== prevSelect) centerLevelSelectCamera(false);
            if (confirmPressedNow() && levelSelectIndex <= maxLevelUnlocked) {
              loadLevel(levelSelectIndex);
              placePlayerAtSpawn();
              initCamera();
              GameState.transitionTo("PLAY");
              return;
            }
            // Particles/shake decay so the screen still feels alive.
            updateLevelSelectCamera();
            updateParticles();
            if (shakeFrames > 0) shakeFrames--;
            return;
          }

          if (GameState.current === "DEAD") {
            if (confirmPressedNow()) {
              GameState.transitionTo("PLAY");
            }
            // Particles still animate under the overlay for a little life.
            updateParticles();
            if (shakeFrames > 0) shakeFrames--;
            return;
          }

          if (GameState.current === "WIN") {
            if (confirmPressedNow()) {
              levelSelectIndex = maxLevelUnlocked;
              GameState.transitionTo("LEVEL_SELECT");
            }
            updateParticles();
            if (shakeFrames > 0) shakeFrames--;
            return;
          }

          // ---- PLAY state ----

          // --- Horizontal movement ---
          const accel = player.onGround ? MOVE_ACCEL : AIR_ACCEL;
          if (isLeft() && !isRight()) {
            player.vx -= accel;
            player.facing = -1;
          } else if (isRight() && !isLeft()) {
            player.vx += accel;
            player.facing = 1;
          } else {
            player.vx *= player.onGround ? FRICTION : AIR_FRICTION;
            if (Math.abs(player.vx) < 0.05) player.vx = 0;
          }
          if (player.vx > MAX_RUN) player.vx = MAX_RUN;
          if (player.vx < -MAX_RUN) player.vx = -MAX_RUN;

          // --- Drop-through (Down + Jump on a one-way platform) ---
          // Must check BEFORE the normal jump-buffer logic so the press is consumed.
          const wantDropThrough =
            player.onGround &&
            player.groundPlatform &&
            player.groundPlatform.type === "one-way" &&
            ((jumpPressedNow() && isDown()) || dropPressedNow());
          if (wantDropThrough) {
            player.dropThrough = DROP_FRAMES;
            player.onGround = false;
            player.groundPlatform = null;
            player.y += 2; // nudge below the platform top
            // Consume the jump press so we don't also buffer a jump.
            delete pressed["Space"];
            delete pressed["ArrowUp"];
            delete pressed["KeyW"];
          }

          // --- Jump: buffering + coyote time ---
          if (jumpPressedNow()) player.buffer = BUFFER_FRAMES;

          const canJump = player.onGround || player.coyote > 0;
          if (player.buffer > 0 && canJump) {
            player.vy = JUMP_VELOCITY;
            player.onGround = false;
            player.coyote = 0;
            player.buffer = 0;
            player.jumpCut = false;
            player.stretchT = 6;
            Sfx.jump();
          }

          // Variable jump height (cut once per jump on release).
          if (!jumpHeld() && player.vy < 0 && !player.jumpCut) {
            player.vy *= JUMP_CUT;
            player.jumpCut = true;
          }

          // --- Gravity ---
          player.vy += GRAVITY;
          if (player.vy > MAX_FALL) player.vy = MAX_FALL;

          const wasOnGround = player.onGround;
          const prevVy = player.vy;

          const collision = moveAndCollide();

          // React to collision events (this is why moveAndCollide returns them).
          if (collision.landed && !wasOnGround) {
            // Just landed this tick. Juice it.
            player.squashT = 7;
            Sfx.land();
            spawnDust(player.x + player.w / 2, player.y + player.h - 1, 6);
            // Hard landings shake a touch.
            if (prevVy > 9) shake(4, 2);
          }
          if (collision.hitCeiling) {
            Sfx.bonk();
            shake(3, 2);
          }

          // Coyote time bookkeeping.
          if (wasOnGround && !player.onGround && player.vy >= 0) {
            player.coyote = COYOTE_FRAMES;
          } else if (player.coyote > 0) {
            player.coyote--;
          }
          if (player.buffer > 0) player.buffer--;
          if (player.dropThrough > 0) player.dropThrough--;
          if (player.squashT > 0) player.squashT--;
          if (player.stretchT > 0) player.stretchT--;

          // --- Pickups ---
          for (const pk of level.pickups) {
            if (pk.taken) continue;
            if (aabb(player, pk)) {
              pk.taken = true;
              score += 100;
              Sfx.pickup();
              spawnDust(pk.x + pk.w / 2, pk.y + pk.h / 2, 4, COLORS.coin);
            }
          }

          // --- Enemies ---
          for (const e of level.enemies) {
            if (!e.alive) continue;
            e.x += e.vx;
            if (e.x < e.minX) {
              e.x = e.minX;
              e.vx = -e.vx;
            }
            if (e.x + e.w > e.maxX) {
              e.x = e.maxX - e.w;
              e.vx = -e.vx;
            }

            if (aabb(player, e)) {
              // Stomp: player is descending AND previous feet were above enemy top.
              const prevFeet = player.y + player.h - player.vy;
              if (player.vy > 0 && prevFeet <= e.y + 2) {
                e.alive = false;
                player.vy = JUMP_VELOCITY * STOMP_BOUNCE;
                player.jumpCut = false;
                player.stretchT = 6;
                score += 200;
                Sfx.stomp();
                spawnDust(e.x + e.w / 2, e.y + e.h, 8, COLORS.enemyDark);
                shake(3, 2);
              } else {
                GameState.transitionTo("DEAD");
                return;
              }
            }
          }

          // --- Score: furthest-right progress only ---
          if (player.x > maxX) {
            score += (player.x - maxX) | 0;
            maxX = player.x;
          }

          // --- Win / lose ---
          // Touching the goal advances to the next level. If this was the final
          // level, advanceLevel() transitions to WIN internally.
          if (aabb(player, goal)) {
            advanceLevel();
            return;
          }
          if (player.y > level.deathY) {
            GameState.transitionTo("DEAD");
            return;
          }

          // Particles, shake, banner tick.
          updateParticles();
          if (shakeFrames > 0) shakeFrames--;
          if (bannerFrames > 0) bannerFrames--;
        }

        // ---------- CAMERA ----------
        // Smoothed follow: X with look-ahead bias, Y locked to last grounded
        // position so the camera doesn't bob mid-jump.
        const cam = { x: 0, y: 0 };
        let lastGroundY = 0;

        function initCamera() {
          lastGroundY = player.y;
          const targetY = lastGroundY - H * 0.7;
          const maxY = level.camFloor - H;
          const minY = Math.min(level.camCeiling, maxY);
          cam.y = Math.max(minY, Math.min(targetY, maxY));
          cam.x = Math.max(
            0,
            Math.min(player.x + player.w / 2 - W / 2, level.endX - W),
          );
        }

        function updateCamera() {
          // Horizontal
          const lookAhead = player.facing * 70;
          const targetX = player.x + player.w / 2 - W / 2 + lookAhead;
          cam.x += (targetX - cam.x) * 0.1;
          if (cam.x < 0) cam.x = 0;
          if (cam.x > level.endX - W) cam.x = level.endX - W;

          // Vertical — only retarget when on ground to avoid jump bobbing.
          if (player.onGround) lastGroundY = player.y;
          const targetY = lastGroundY - H * 0.7;
          cam.y += (targetY - cam.y) * 0.08;
          const maxY = level.camFloor - H;
          const minY = Math.min(level.camCeiling, maxY);
          if (cam.y < minY) cam.y = minY;
          if (cam.y > maxY) cam.y = maxY;
        }

        // ---------- RENDER ----------
        function drawCloud(x, y, s) {
          ctx.fillStyle = COLORS.cloud;
          ctx.beginPath();
          ctx.arc(x, y, 18 * s, 0, Math.PI * 2);
          ctx.arc(x + 22 * s, y - 8 * s, 24 * s, 0, Math.PI * 2);
          ctx.arc(x + 50 * s, y, 18 * s, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillRect(x - 2, y, 54 * s, 16 * s);
          ctx.fillStyle = COLORS.cloudShade;
          ctx.fillRect(x - 2, y + 12 * s, 54 * s, 4 * s);
        }

        // A far-off keep on the horizon: the place the trail is heading, and the
        // only thing in the scene allowed to stay hazy purple.
        function drawFarCastle(x, baseY, s) {
          ctx.fillStyle = COLORS.castle;
          ctx.fillRect(x + 30 * s, baseY - 52 * s, 60 * s, 52 * s);
          for (let i = 0; i < 4; i++) {
            ctx.fillRect(x + (32 + i * 15) * s, baseY - 60 * s, 9 * s, 9 * s);
          }
          for (const tx of [x, x + 96 * s]) {
            ctx.fillRect(tx, baseY - 74 * s, 24 * s, 74 * s);
            ctx.fillStyle = COLORS.castleDark;
            ctx.beginPath();
            ctx.moveTo(tx - 5 * s, baseY - 74 * s);
            ctx.lineTo(tx + 12 * s, baseY - 98 * s);
            ctx.lineTo(tx + 29 * s, baseY - 74 * s);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = COLORS.castle;
          }
          ctx.fillStyle = COLORS.castleDark;
          ctx.fillRect(x + 52 * s, baseY - 26 * s, 16 * s, 26 * s);
        }

        function drawTree(x, baseY, s) {
          ctx.fillStyle = "#5A3A20";
          ctx.fillRect(x - 3 * s, baseY - 16 * s, 6 * s, 16 * s);
          ctx.fillStyle = "#3F7F38";
          ctx.beginPath();
          ctx.arc(x, baseY - 30 * s, 16 * s, 0, Math.PI * 2);
          ctx.arc(x - 13 * s, baseY - 22 * s, 11 * s, 0, Math.PI * 2);
          ctx.arc(x + 13 * s, baseY - 22 * s, 11 * s, 0, Math.PI * 2);
          ctx.fill();
        }

        function drawShrub(x, y, w, h, color) {
          ctx.fillStyle = color;
          ctx.fillRect(x, y + h * 0.35, w, h * 0.65);
          ctx.beginPath();
          ctx.arc(x + w * 0.3, y + h * 0.4, w * 0.32, 0, Math.PI * 2);
          ctx.arc(x + w * 0.72, y + h * 0.45, w * 0.28, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "rgba(255,255,255,0.22)";
          ctx.fillRect(x + w * 0.2, y + h * 0.3, 3, 3);
        }

        function drawHillRow(offset, period, baseY, height, color) {
          ctx.fillStyle = color;
          for (let i = -1; i < Math.ceil(W / period) + 2; i++) {
            const bx = offset + i * period;
            ctx.beginPath();
            ctx.moveTo(bx, baseY);
            ctx.quadraticCurveTo(bx + period / 2, baseY - height, bx + period, baseY);
            ctx.lineTo(bx + period, H);
            ctx.lineTo(bx, H);
            ctx.closePath();
            ctx.fill();
          }
        }

        function drawBackground() {
          if (!skyGradient) {
            skyGradient = ctx.createLinearGradient(0, 0, 0, H);
            skyGradient.addColorStop(0, COLORS.skyTop);
            skyGradient.addColorStop(0.55, COLORS.skyMid);
            skyGradient.addColorStop(1, COLORS.skyLow);
          }
          ctx.fillStyle = skyGradient;
          ctx.fillRect(0, 0, W, H);

          ctx.fillStyle = COLORS.sun;
          ctx.beginPath();
          ctx.arc(W * 0.76, 96, 54, 0, Math.PI * 2);
          ctx.fill();

          const cloudOff = -((cam.x * 0.12) % 520);
          for (let i = -1; i < Math.ceil(W / 520) + 2; i++) {
            const bx = cloudOff + i * 520;
            drawCloud(bx + 40, 74, 1);
            drawCloud(bx + 300, 140, 0.7);
          }

          const keepOff = -((cam.x * 0.2) % 1600);
          for (let i = -1; i < Math.ceil(W / 1600) + 2; i++) {
            drawFarCastle(keepOff + i * 1600 + 620, H - 168, 0.85);
          }

          const farOff = -((cam.x * 0.2) % 460);
          drawHillRow(farOff, 460, H - 150, 92, COLORS.hillFar);

          const nearOff = -((cam.x * 0.45) % 340);
          drawHillRow(nearOff, 340, H - 84, 104, COLORS.hillNear);
          for (let i = -1; i < Math.ceil(W / 340) + 2; i++) {
            const bx = nearOff + i * 340;
            drawTree(bx + 170, H - 134, 1);
            drawTree(bx + 246, H - 118, 0.72);
            drawTree(bx + 96, H - 118, 0.66);
          }

          // --- Bramble pit ---
          // Drawn behind platforms. Platforms extend to the bottom of the canvas so
          // they cover this band wherever they exist — gaps reveal the thorns.
          const bandTop = H - 50;
          ctx.fillStyle = COLORS.pitBand;
          ctx.fillRect(0, bandTop, W, H - bandTop);
          ctx.fillStyle = COLORS.bramble;
          for (let i = 0; i < W + 20; i += 18) {
            ctx.beginPath();
            ctx.moveTo(i, bandTop);
            ctx.lineTo(i + 9, bandTop - 18);
            ctx.lineTo(i + 18, bandTop);
            ctx.closePath();
            ctx.fill();
            ctx.fillRect(i + 7, bandTop - 6, 4, 4);
          }
        }

        function drawPlatform(p) {
          const x = p.x - cam.x,
            y = p.y - cam.y;
          if (x + p.w < 0 || x > W) return;
          if (p.type === "one-way") {
            // A plank walkway: you can hop up through it, so it should look like
            // something you could hop up through.
            ctx.fillStyle = COLORS.plank;
            ctx.fillRect(x, y, p.w, 7);
            ctx.fillStyle = COLORS.plankDark;
            ctx.fillRect(x, y + 7, p.w, 3);
            for (let dx = 6; dx < p.w - 4; dx += 22) {
              ctx.fillRect(x + dx, y, 2, 7);
            }
            return;
          }
          ctx.fillStyle = COLORS.rock;
          ctx.fillRect(x, y, p.w, p.h);
          ctx.fillStyle = COLORS.rockDark;
          for (let dx = 4; dx < p.w - 6; dx += 26) {
            const dy = 14 + ((dx * 7) % 3) * 8;
            if (dy < p.h - 6) ctx.fillRect(x + dx, y + dy, 10, 5);
          }
          ctx.fillStyle = COLORS.rockDark;
          ctx.fillRect(x, y + p.h - 6, p.w, 6);
          ctx.fillStyle = COLORS.grass;
          ctx.fillRect(x, y, p.w, 7);
          ctx.fillStyle = COLORS.grassDark;
          ctx.fillRect(x, y + 7, p.w, 3);
          ctx.fillStyle = COLORS.grass;
          for (let dx = 5; dx < p.w - 3; dx += 17) {
            ctx.fillRect(x + dx, y - 3, 3, 3);
          }
        }

        function drawGoal() {
          const x = goal.x - cam.x,
            y = goal.y - cam.y;
          ctx.fillStyle = COLORS.goalPole;
          ctx.fillRect(x, y, goal.w, goal.h);
          ctx.fillStyle = COLORS.goalFlagB;
          ctx.fillRect(x - 2, y - 6, goal.w + 4, 6);
          const wave = Math.sin(renderTick * 0.12) * 3;
          ctx.fillStyle = COLORS.goalFlagA;
          ctx.beginPath();
          ctx.moveTo(x + goal.w, y + 2);
          ctx.lineTo(x + goal.w + 46, y + 16 + wave);
          ctx.lineTo(x + goal.w, y + 30);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = COLORS.goalFlagB;
          ctx.fillRect(x + goal.w, y + 14, 30 + wave, 4);
        }

        function drawPickup(pk, t) {
          if (pk.taken) return;
          const x = pk.x - cam.x,
            y = pk.y - cam.y;
          if (x + pk.w < 0 || x > W) return;
          // Pulse size a bit to draw the eye.
          const pulse = Math.sin(t * 0.15 + pk.x * 0.01) * 1.5;
          const w = pk.w + pulse,
            h = pk.h + pulse;
          const cx = x + pk.w / 2 - w / 2;
          const cy = y + pk.h / 2 - h / 2;
          ctx.fillStyle = COLORS.coinDark;
          ctx.fillRect(cx, cy, w, h);
          ctx.fillStyle = COLORS.coin;
          ctx.fillRect(cx + 2, cy + 2, w - 4, h - 4);
          ctx.fillStyle = "rgba(255,255,255,0.75)";
          ctx.fillRect(cx + 3, cy + 3, 3, 3);
        }

        function drawEnemy(e) {
          if (!e.alive) return;
          const x = e.x - cam.x,
            y = e.y - cam.y;
          if (x + e.w < 0 || x > W) return;
          // Stem
          ctx.fillStyle = COLORS.enemyFoot;
          ctx.fillRect(x + 3, y + e.h * 0.45, e.w - 6, e.h * 0.55);
          // Cap
          ctx.fillStyle = COLORS.enemyBody;
          ctx.fillRect(x, y + 4, e.w, e.h * 0.45);
          ctx.fillRect(x + 3, y + 1, e.w - 6, 4);
          ctx.fillStyle = COLORS.enemyDark;
          ctx.fillRect(x, y + e.h * 0.45, e.w, 3);
          // Cap spots
          ctx.fillStyle = COLORS.enemyFoot;
          ctx.fillRect(x + 4, y + 6, 4, 4);
          ctx.fillRect(x + e.w - 9, y + 9, 3, 3);
          // Eyes on the stem, facing the way it walks
          ctx.fillStyle = "#3A2412";
          const ex = e.vx > 0 ? x + e.w - 9 : x + 5;
          ctx.fillRect(ex, y + e.h * 0.62, 3, 4);
          ctx.fillRect(ex + (e.vx > 0 ? -6 : 6), y + e.h * 0.62, 3, 4);
        }

        function drawPlayer() {
          // Visual squash/stretch — scale is applied around the feet so the player
          // "sticks" to the ground when squashing.
          let sx = 1,
            sy = 1;
          if (player.squashT > 0) {
            const k = player.squashT / 7;
            sx = 1 + 0.25 * k;
            sy = 1 - 0.25 * k;
          } else if (player.stretchT > 0) {
            const k = player.stretchT / 6;
            sx = 1 - 0.12 * k;
            sy = 1 + 0.18 * k;
          }

          const drawW = player.w * sx;
          const drawH = player.h * sy;
          const x = player.x - cam.x + (player.w - drawW) / 2;
          const y = player.y - cam.y + (player.h - drawH); // pin to feet

          if (playerSpriteReady) {
            ctx.save();
            if (player.facing < 0) {
              ctx.translate(x + drawW, y);
              ctx.scale(-1, 1);
              ctx.drawImage(playerSprite, 0, 0, drawW, drawH);
            } else {
              ctx.drawImage(playerSprite, x, y, drawW, drawH);
            }
            ctx.restore();
            return;
          }

          // Pants (lower half)
          ctx.fillStyle = COLORS.playerPants;
          ctx.fillRect(x, y + drawH / 2, drawW, drawH / 2);
          // Shirt (upper half, below helmet)
          const helmetH = Math.max(6, drawH * 0.25);
          ctx.fillStyle = COLORS.playerShirt;
          ctx.fillRect(x, y + helmetH, drawW, drawH / 2 - helmetH);
          // Helmet
          ctx.fillStyle = COLORS.playerHelmet;
          ctx.fillRect(x, y, drawW, helmetH);
          // Eye
          ctx.fillStyle = "#000";
          const eyeX = player.facing > 0 ? x + drawW - 8 : x + 4;
          ctx.fillRect(eyeX, y + helmetH + 2, 4, 4);
        }

        function drawParticles() {
          for (const p of particles) {
            const px = p.x - cam.x,
              py = p.y - cam.y;
            // Fade via alpha isn't worth a setter dance — use size drop-off instead.
            const s = p.life < 6 ? Math.max(1, p.size - 1) : p.size;
            ctx.fillStyle = p.color;
            ctx.fillRect(px, py, s, s);
          }
        }

        // The play HUD borrows the map's carved-parchment plate and pixel face so
        // the two screens read as one game.
        function drawHud() {
          const lines = viewport.touch
            ? [
                "LEFT HALF  DRAG TO MOVE",
                "RIGHT HALF  TAP OR SWIPE TO JUMP",
                "SWIPE DOWN  DROP THROUGH PLANKS",
              ]
            : ["A/D  MOVE     SPACE  JUMP", "S+SPACE  DROP     P  PAUSE"];
          const plateW = 328;
          const plateH = 52 + lines.length * 15;
          ctx.fillStyle = "rgba(30,18,40,0.28)";
          ctx.fillRect(16, 17, plateW, plateH);
          ctx.fillStyle = COLORS.parchmentEdge;
          ctx.fillRect(12, 12, plateW, plateH);
          ctx.fillStyle = COLORS.parchment;
          ctx.fillRect(15, 15, plateW - 6, plateH - 6);

          ctx.fillStyle = COLORS.coinDark;
          ctx.fillRect(26, 25, 12, 12);
          ctx.fillStyle = COLORS.coin;
          ctx.fillRect(28, 27, 8, 8);
          pxText(String(score), 46, 26, 2, COLORS.ink);
          pxText(
            (level.name || "") +
              "   " +
              (currentLevelIndex + 1) +
              "/" +
              LEVELS.length,
            26,
            46,
            2,
            COLORS.inkSoft,
          );

          ctx.save();
          ctx.fillStyle = "rgba(58,36,18,0.72)";
          ctx.font = 'bold 11px "Courier New", monospace';
          ctx.textBaseline = "top";
          ctx.textAlign = "start";
          lines.forEach((line, i) => ctx.fillText(line, 26, 66 + i * 15));
          ctx.restore();

          if (
            viewport.touch &&
            GameState.current !== "DEAD" &&
            GameState.current !== "WIN"
          ) {
            ctx.fillStyle = COLORS.parchmentEdge;
            ctx.fillRect(W - 72, 12, 60, 60);
            ctx.fillStyle = COLORS.parchment;
            ctx.fillRect(W - 69, 15, 54, 54);
            ctx.fillStyle = COLORS.ink;
            ctx.fillRect(W - 54, 28, 8, 28);
            ctx.fillRect(W - 38, 28, 8, 28);
          }

          // Transient level-name banner — shown briefly after load.
          if (bannerFrames > 0 && GameState.current === "PLAY") {
            // Fade in/out via a simple triangle over the banner lifetime.
            const k =
              bannerFrames > 90 ? (110 - bannerFrames) / 20 : bannerFrames / 90;
            ctx.globalAlpha = Math.max(0, Math.min(1, k));
            const ribbonW = Math.max(pxWidth(bannerText, 5) + 96, 320);
            const ribbonH = 88;
            const ribbonX = Math.round((W - ribbonW) / 2);
            const ribbonY = H / 2 - 54;
            ctx.fillStyle = "rgba(30,18,40,0.35)";
            ctx.fillRect(ribbonX + 6, ribbonY + 7, ribbonW, ribbonH);
            ctx.fillStyle = COLORS.parchmentEdge;
            ctx.fillRect(ribbonX, ribbonY, ribbonW, ribbonH);
            ctx.fillStyle = COLORS.parchment;
            ctx.fillRect(ribbonX + 4, ribbonY + 4, ribbonW - 8, ribbonH - 8);
            ctx.fillStyle = COLORS.parchmentEdge;
            ctx.fillRect(ribbonX + 4, ribbonY + 26, ribbonW - 8, 2);
            pxText(bannerEyebrow, W / 2, ribbonY + 12, 2, COLORS.inkSoft, {
              align: "center",
            });
            pxText(bannerText, W / 2, ribbonY + 40, 5, COLORS.ink, {
              align: "center",
            });
            ctx.textAlign = "start";
            ctx.globalAlpha = 1;
          }

          const s = GameState.current;
          if (s === "DEAD" || s === "WIN" || s === "PAUSE") {
            ctx.fillStyle = "rgba(34,20,46,0.72)";
            ctx.fillRect(0, 0, W, H);
            ctx.textAlign = "center";
            if (s === "DEAD") {
              pxText("TRY AGAIN", W / 2, H / 2 - 76, 7, "#FF9DC4", {
                align: "center",
                shadow: "rgba(20,10,28,0.85)",
                shadowOffset: 3,
              });
            } else if (s === "WIN") {
              pxText("YOU MADE IT", W / 2, H / 2 - 76, 7, COLORS.coin, {
                align: "center",
                shadow: "rgba(20,10,28,0.85)",
                shadowOffset: 3,
              });
            } else {
              pxText("PAUSED", W / 2, H / 2 - 76, 7, COLORS.parchment, {
                align: "center",
                shadow: "rgba(20,10,28,0.85)",
                shadowOffset: 3,
              });
            }
            ctx.fillStyle = COLORS.hudText;
            ctx.font = 'bold 20px "Courier New", monospace';
            if (s === "PAUSE") {
              ctx.fillText(
                viewport.touch
                  ? "Tap the pause badge to resume"
                  : "Press P or ESC to resume",
                W / 2,
                H / 2 + 20,
              );
              if (!viewport.touch) {
                ctx.fillText(
                  "Press Q to quit to level select",
                  W / 2,
                  H / 2 + 50,
                );
              }
            } else {
              ctx.fillText("Coins gathered: " + score, W / 2, H / 2 + 10);
              const actionText =
                s === "WIN"
                  ? viewport.touch
                    ? "Tap to return to the map"
                    : "Press ENTER or SPACE for the map"
                  : viewport.touch
                    ? "Tap to retry"
                    : "Press R or SPACE to retry";
              ctx.fillText(actionText, W / 2, H / 2 + 42);
            }
            ctx.textAlign = "start";
          }
        }

        // ---------- LEVEL-SELECT ART ----------
        // The map is staged as a lit diorama: a finite island of land floating in
        // dusk, so the trail reads as a composed place instead of an endless field
        // of grass tiles. Accents are the princess's own colors — crown gold and
        // dress pink — so the map belongs to her and not to a generic UI kit.
        const LS_THEME = {
          voidTop: "#3A2160",
          voidBottom: "#1B1030",
          duskHillFar: "#412C68",
          duskHillNear: "#2B1C4B",
          glow: "rgba(255,206,120,0.20)",
          soilTop: "#6B4220",
          soilFace: "#4A2C13",
          soilSide: "#33200F",
          trailFill: "#F2DCA4",
          trailEdge: "#A8763A",
          trailEdgeCold: "#6E5A3E",
          trailFillCold: "#B7A47E",
          trailShadow: "rgba(12,6,24,0.45)",
          trailDust: "rgba(255,214,132,0.55)",
          parchment: "#F6E6BE",
          parchmentDark: "#D9BF8C",
          ink: "#3A2412",
          royal: "#E8368F",
          royalDark: "#9C1B58",
          gold: "#FFC531",
          goldDark: "#B57C0E",
          cream: "#FFF3D6",
          creamDim: "rgba(255,243,214,0.55)",
          ground: "#6aa257",
          groundDark: "#548846",
          nodeWood: "#f1d9a0",
          nodeBark: "#7a4f2b",
        };
        const LS_MAP = {
          tileW: 104,
          tileH: 52,
          groundTileW: 136,
          nodeW: 112,
          centerX: W / 2,
          centerY: H / 2 + 4,
          cameraEase: 0.16,
          dragDeadzone: 8,
          islandRadius: 2.7,
          cliffDepth: 30,
          fitPadX: 150,
          fitPadY: 120,
        };

        // 5x7 display face. A system font would break the game's pixel grid, and
        // this stays crisp and offline at any size. Courier is kept for the small
        // utility line only, so the two roles never blur together.
        const PX_GLYPHS = {
          A: [0x0e, 0x11, 0x11, 0x1f, 0x11, 0x11, 0x11],
          B: [0x1e, 0x11, 0x11, 0x1e, 0x11, 0x11, 0x1e],
          C: [0x0e, 0x11, 0x10, 0x10, 0x10, 0x11, 0x0e],
          D: [0x1e, 0x11, 0x11, 0x11, 0x11, 0x11, 0x1e],
          E: [0x1f, 0x10, 0x10, 0x1e, 0x10, 0x10, 0x1f],
          F: [0x1f, 0x10, 0x10, 0x1e, 0x10, 0x10, 0x10],
          G: [0x0e, 0x11, 0x10, 0x17, 0x11, 0x11, 0x0f],
          H: [0x11, 0x11, 0x11, 0x1f, 0x11, 0x11, 0x11],
          I: [0x0e, 0x04, 0x04, 0x04, 0x04, 0x04, 0x0e],
          J: [0x01, 0x01, 0x01, 0x01, 0x01, 0x11, 0x0e],
          K: [0x11, 0x12, 0x14, 0x18, 0x14, 0x12, 0x11],
          L: [0x10, 0x10, 0x10, 0x10, 0x10, 0x10, 0x1f],
          M: [0x11, 0x1b, 0x15, 0x15, 0x11, 0x11, 0x11],
          N: [0x11, 0x19, 0x15, 0x13, 0x11, 0x11, 0x11],
          O: [0x0e, 0x11, 0x11, 0x11, 0x11, 0x11, 0x0e],
          P: [0x1e, 0x11, 0x11, 0x1e, 0x10, 0x10, 0x10],
          Q: [0x0e, 0x11, 0x11, 0x11, 0x15, 0x12, 0x0d],
          R: [0x1e, 0x11, 0x11, 0x1e, 0x14, 0x12, 0x11],
          S: [0x0f, 0x10, 0x10, 0x0e, 0x01, 0x01, 0x1e],
          T: [0x1f, 0x04, 0x04, 0x04, 0x04, 0x04, 0x04],
          U: [0x11, 0x11, 0x11, 0x11, 0x11, 0x11, 0x0e],
          V: [0x11, 0x11, 0x11, 0x11, 0x11, 0x0a, 0x04],
          W: [0x11, 0x11, 0x11, 0x15, 0x15, 0x1b, 0x11],
          X: [0x11, 0x11, 0x0a, 0x04, 0x0a, 0x11, 0x11],
          Y: [0x11, 0x11, 0x0a, 0x04, 0x04, 0x04, 0x04],
          Z: [0x1f, 0x01, 0x02, 0x04, 0x08, 0x10, 0x1f],
          0: [0x0e, 0x11, 0x13, 0x15, 0x19, 0x11, 0x0e],
          1: [0x04, 0x0c, 0x04, 0x04, 0x04, 0x04, 0x0e],
          2: [0x0e, 0x11, 0x01, 0x02, 0x04, 0x08, 0x1f],
          3: [0x1f, 0x02, 0x04, 0x02, 0x01, 0x11, 0x0e],
          4: [0x02, 0x06, 0x0a, 0x12, 0x1f, 0x02, 0x02],
          5: [0x1f, 0x10, 0x1e, 0x01, 0x01, 0x11, 0x0e],
          6: [0x06, 0x08, 0x10, 0x1e, 0x11, 0x11, 0x0e],
          7: [0x1f, 0x01, 0x02, 0x04, 0x04, 0x04, 0x04],
          8: [0x0e, 0x11, 0x11, 0x0e, 0x11, 0x11, 0x0e],
          9: [0x0e, 0x11, 0x11, 0x0f, 0x01, 0x02, 0x0c],
          "-": [0x00, 0x00, 0x00, 0x1f, 0x00, 0x00, 0x00],
          "/": [0x01, 0x01, 0x02, 0x04, 0x08, 0x10, 0x10],
          ".": [0x00, 0x00, 0x00, 0x00, 0x00, 0x0c, 0x0c],
          "!": [0x04, 0x04, 0x04, 0x04, 0x04, 0x00, 0x04],
          "?": [0x0e, 0x11, 0x01, 0x02, 0x04, 0x00, 0x04],
          " ": [0, 0, 0, 0, 0, 0, 0],
        };
        const PX_W = 5,
          PX_H = 7;

        const lsReduceMotion =
          typeof matchMedia === "function" &&
          matchMedia("(prefers-reduced-motion: reduce)").matches;

        function pxWidth(text, scale) {
          return text.length ? (text.length * (PX_W + 1) - 1) * scale : 0;
        }

        function pxBlit(text, x, y, scale, color) {
          ctx.fillStyle = color;
          let cx = x;
          for (const ch of String(text).toUpperCase()) {
            const glyph = PX_GLYPHS[ch];
            if (glyph) {
              for (let r = 0; r < PX_H; r++) {
                const bits = glyph[r];
                if (!bits) continue;
                for (let c = 0; c < PX_W; c++) {
                  if (bits & (1 << (PX_W - 1 - c))) {
                    ctx.fillRect(cx + c * scale, y + r * scale, scale, scale);
                  }
                }
              }
            }
            cx += (PX_W + 1) * scale;
          }
        }

        // y is the cap line (top of the glyph box); height is always PX_H * scale.
        function pxText(text, x, y, scale, color, opts = {}) {
          const w = pxWidth(text, scale);
          const sx = Math.round(
            opts.align === "center"
              ? x - w / 2
              : opts.align === "right"
                ? x - w
                : x,
          );
          const sy = Math.round(y);
          if (opts.outline) {
            for (const [ox, oy] of [
              [-scale, 0],
              [scale, 0],
              [0, -scale],
              [0, scale],
            ]) {
              pxBlit(text, sx + ox, sy + oy, scale, opts.outline);
            }
          }
          if (opts.shadow) {
            pxBlit(text, sx, sy + (opts.shadowOffset || scale), scale, opts.shadow);
          }
          pxBlit(text, sx, sy, scale, color);
          return w;
        }

        function pxIcon(rows, x, y, scale, color) {
          ctx.fillStyle = color;
          for (let r = 0; r < rows.length; r++) {
            const row = rows[r];
            for (let c = 0; c < row.length; c++) {
              if (row[c] !== " ") {
                ctx.fillRect(x + c * scale, y + r * scale, scale, scale);
              }
            }
          }
        }

        const PX_CROWN = ["# # #", "#####", "#####"];
        const PX_LOCK = [" ### ", "#   #", "#####", "## ##", "#####"];

        function lsRoundedPath(x, y, w, h, r) {
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.lineTo(x + w - r, y);
          ctx.arcTo(x + w, y, x + w, y + r, r);
          ctx.lineTo(x + w, y + h - r);
          ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
          ctx.lineTo(x + r, y + h);
          ctx.arcTo(x, y + h, x, y + h - r, r);
          ctx.lineTo(x, y + r);
          ctx.arcTo(x, y, x + r, y, r);
          ctx.closePath();
        }

        // Carved plaque: dark bevel under a parchment face, no border radius, so
        // the HUD reads as part of the world rather than a web card.
        function lsPlaque(x, y, w, h, fill, edge) {
          ctx.fillStyle = "rgba(10,5,20,0.45)";
          ctx.fillRect(x + 4, y + 5, w, h);
          ctx.fillStyle = edge;
          ctx.fillRect(x, y, w, h);
          ctx.fillStyle = fill;
          ctx.fillRect(x + 3, y + 3, w - 6, h - 6);
        }

        function lsNoise(n) {
          const s = Math.sin(n * 127.1 + 311.7) * 43758.5453123;
          return s - Math.floor(s);
        }

        function isoToWorld(gx, gy, z = 0) {
          return {
            x: ((gx - gy) * LS_MAP.tileW) / 2,
            y: ((gx + gy) * LS_MAP.tileH) / 2 - z,
          };
        }

        function worldToGrid(wx, wy) {
          const a = wx / (LS_MAP.tileW / 2);
          const b = wy / (LS_MAP.tileH / 2);
          return {
            gx: (a + b) / 2,
            gy: (b - a) / 2,
          };
        }

        function worldToScreen(wx, wy) {
          return {
            x: wx - levelSelectCamera.x + LS_MAP.centerX,
            y: wy - levelSelectCamera.y + LS_MAP.centerY,
          };
        }

        function isoToScreen(gx, gy, z = 0) {
          const world = isoToWorld(gx, gy, z);
          return worldToScreen(world.x, world.y);
        }

        function levelGridPoint(index) {
          const bend = Math.round(Math.sin(index * 1.15) * 2);
          return {
            gx: index * 1.45 + bend * 0.25,
            gy: -index * 1.45 + bend * 0.75,
          };
        }

        function levelWorldPoint(index) {
          const p = levelGridPoint(index);
          return isoToWorld(p.gx, p.gy);
        }

        // The land is only the ground near the trail. Cached because the trail
        // never moves; the edge is jittered so the coastline is not a clean arc.
        const lsIslandCache = new Map();
        let lsTrailSamples = null;

        function trailSamples() {
          if (lsTrailSamples) return lsTrailSamples;
          const pts = [];
          for (let i = 0; i < LEVELS.length; i++) {
            const a = levelGridPoint(i);
            pts.push(a);
            if (i === LEVELS.length - 1) break;
            const b = levelGridPoint(i + 1);
            for (let t = 0.2; t < 1; t += 0.2) {
              pts.push({
                gx: a.gx + (b.gx - a.gx) * t,
                gy: a.gy + (b.gy - a.gy) * t,
              });
            }
          }
          lsTrailSamples = pts;
          return pts;
        }

        function baseIslandTile(gx, gy) {
          const key = gx + ":" + gy;
          const hit = lsIslandCache.get(key);
          if (hit !== undefined) return hit;
          let best = Infinity;
          for (const p of trailSamples()) {
            const ahead = gx + gy - (p.gx + p.gy);
            const d =
              Math.hypot(gx - p.gx, gy - p.gy) * (ahead > 0 ? 1.3 : 0.92);
            if (d < best) best = d;
          }
          const jitter = (lsNoise(gx * 12.9 + gy * 78.2) - 0.5) * 0.5;
          const on = best <= LS_MAP.islandRadius + jitter;
          lsIslandCache.set(key, on);
          return on;
        }

        // A tile clinging on by one corner reads as a rendering mistake, so the
        // coastline keeps only land that has neighbours to hold on to.
        const lsIslandSmoothed = new Map();
        function isIslandTile(gx, gy) {
          const key = gx + ":" + gy;
          const hit = lsIslandSmoothed.get(key);
          if (hit !== undefined) return hit;
          let on = baseIslandTile(gx, gy);
          if (on) {
            const n =
              baseIslandTile(gx + 1, gy) +
              baseIslandTile(gx - 1, gy) +
              baseIslandTile(gx, gy + 1) +
              baseIslandTile(gx, gy - 1);
            on = n >= 2;
          }
          lsIslandSmoothed.set(key, on);
          return on;
        }

        function centerLevelSelectCamera(immediate = false) {
          const fit = lsFitTarget();
          const p = fit || levelWorldPoint(levelSelectIndex);
          levelSelectCamera.targetX = p.x;
          levelSelectCamera.targetY = p.y;
          if (immediate || !levelSelectCamera.initialized) {
            levelSelectCamera.x = p.x;
            levelSelectCamera.y = p.y;
            levelSelectCamera.initialized = true;
          }
        }

        // When the whole island fits on screen it is framed once and held still —
        // a small map should be a composition, not a viewport that drifts.
        let lsFitCache;
        function lsFitTarget() {
          if (lsFitCache !== undefined) return lsFitCache;
          let minX = Infinity,
            maxX = -Infinity,
            minY = Infinity,
            maxY = -Infinity;
          for (let i = 0; i < LEVELS.length; i++) {
            const p = levelWorldPoint(i);
            minX = Math.min(minX, p.x);
            maxX = Math.max(maxX, p.x);
            minY = Math.min(minY, p.y);
            maxY = Math.max(maxY, p.y);
          }
          const spanX = maxX - minX + LS_MAP.fitPadX * 2;
          const spanY = maxY - minY + LS_MAP.fitPadY * 2;
          lsFitCache =
            spanX <= W - 60 && spanY <= H - 150
              ? { x: (minX + maxX) / 2, y: (minY + maxY) / 2 }
              : null;
          return lsFitCache;
        }

        function updateLevelSelectCamera() {
          if (levelSelectCamera.dragging) return;
          levelSelectCamera.x +=
            (levelSelectCamera.targetX - levelSelectCamera.x) *
            LS_MAP.cameraEase;
          levelSelectCamera.y +=
            (levelSelectCamera.targetY - levelSelectCamera.y) *
            LS_MAP.cameraEase;
        }

        function beginLevelSelectPointer(e, point) {
          return {
            role: "level-select",
            id: e.pointerId,
            x: point.x,
            y: point.y,
            startX: point.x,
            startY: point.y,
            cameraStartX: levelSelectCamera.x,
            cameraStartY: levelSelectCamera.y,
            moved: false,
          };
        }

        function updateLevelSelectPointer(state) {
          const dx = state.x - state.startX;
          const dy = state.y - state.startY;
          if (Math.hypot(dx, dy) >= LS_MAP.dragDeadzone) {
            state.moved = true;
            levelSelectCamera.dragging = true;
          }
          if (!state.moved) return;
          levelSelectCamera.x = state.cameraStartX - dx;
          levelSelectCamera.y = state.cameraStartY - dy;
          levelSelectCamera.targetX = levelSelectCamera.x;
          levelSelectCamera.targetY = levelSelectCamera.y;
        }

        function finishLevelSelectPointer(state) {
          levelSelectCamera.dragging = false;
          if (state.moved) {
            centerLevelSelectCamera(false);
            return;
          }
          if (
            levelSelectPlayArea &&
            state.x >= levelSelectPlayArea.x &&
            state.x <= levelSelectPlayArea.x + levelSelectPlayArea.w &&
            state.y >= levelSelectPlayArea.y &&
            state.y <= levelSelectPlayArea.y + levelSelectPlayArea.h
          ) {
            fireTouchConfirm();
            return;
          }
          const hit = levelSelectHitAreas.find((h) => {
            const dx = state.x - h.x;
            const dy = state.y - h.y;
            return dx * dx + dy * dy <= h.r * h.r;
          });
          if (!hit || hit.index > maxLevelUnlocked) return;
          if (hit.index === levelSelectIndex) {
            fireTouchConfirm();
            return;
          }
          levelSelectIndex = hit.index;
          centerLevelSelectCamera(false);
        }

        function lsDrawAtlasFrame(
          name,
          sx,
          sy,
          dispW,
          anchorY = 1,
          alpha = 1,
          filter = "saturate(0.94) contrast(0.97) brightness(0.98)",
        ) {
          const r = FOREST_ATLAS[name];
          if (!r || !forestSheetReady) return null;
          const dispH = dispW * (r.sh / r.sw);
          if (
            sx + dispW / 2 < -120 ||
            sx - dispW / 2 > W + 120 ||
            sy + dispH < -120 ||
            sy - dispH > H + 120
          ) {
            return {
              dx: sx - dispW / 2,
              dy: sy - dispH * anchorY,
              dw: dispW,
              dh: dispH,
            };
          }
          ctx.save();
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = "high";
          ctx.globalAlpha = alpha;
          ctx.filter = filter;
          ctx.drawImage(
            forestSheet,
            r.sx,
            r.sy,
            r.sw,
            r.sh,
            sx - dispW / 2,
            sy - dispH * anchorY,
            dispW,
            dispH,
          );
          ctx.restore();
          return {
            dx: sx - dispW / 2,
            dy: sy - dispH * anchorY,
            dw: dispW,
            dh: dispH,
          };
        }

        function lsGroundFrame(gx, gy) {
          const n = lsNoise(gx * 31.3 + gy * 17.9);
          if (n > 0.91) return "grassFlowers";
          if (n > 0.68) return "grassDark";
          return "grass";
        }

        function drawIsoDiamondTile(screen, fill) {
          ctx.fillStyle = fill;
          ctx.beginPath();
          ctx.moveTo(screen.x, screen.y - LS_MAP.tileH / 2);
          ctx.lineTo(screen.x + LS_MAP.tileW / 2, screen.y);
          ctx.lineTo(screen.x, screen.y + LS_MAP.tileH / 2);
          ctx.lineTo(screen.x - LS_MAP.tileW / 2, screen.y);
          ctx.closePath();
          ctx.fill();
        }

        function drawLevelSelectSky() {
          const sky = ctx.createLinearGradient(0, 0, 0, H);
          sky.addColorStop(0, LS_THEME.voidTop);
          sky.addColorStop(1, LS_THEME.voidBottom);
          ctx.fillStyle = sky;
          ctx.fillRect(0, 0, W, H);

          const glow = ctx.createRadialGradient(
            W / 2,
            H * 0.46,
            40,
            W / 2,
            H * 0.46,
            W * 0.52,
          );
          glow.addColorStop(0, LS_THEME.glow);
          glow.addColorStop(1, "rgba(255,206,120,0)");
          ctx.fillStyle = glow;
          ctx.fillRect(0, 0, W, H);

          // The same country you play in, seen at dusk from far off: the island
          // floats above it, and the keep on the horizon is where the trail ends.
          const drift = -((levelSelectCamera.x * 0.06) % 620);
          for (let i = -1; i < Math.ceil(W / 620) + 2; i++) {
            const bx = drift + i * 620;
            ctx.fillStyle = LS_THEME.duskHillFar;
            ctx.beginPath();
            ctx.moveTo(bx, H - 54);
            ctx.quadraticCurveTo(bx + 310, H - 118, bx + 620, H - 54);
            ctx.lineTo(bx + 620, H);
            ctx.lineTo(bx, H);
            ctx.closePath();
            ctx.fill();
            drawDuskKeep(bx + 96, H - 92);
          }
          for (let i = -1; i < Math.ceil(W / 470) + 2; i++) {
            const bx = drift * 1.6 + i * 470;
            ctx.fillStyle = LS_THEME.duskHillNear;
            ctx.beginPath();
            ctx.moveTo(bx, H - 18);
            ctx.quadraticCurveTo(bx + 235, H - 70, bx + 470, H - 18);
            ctx.lineTo(bx + 470, H);
            ctx.lineTo(bx, H);
            ctx.closePath();
            ctx.fill();
          }
        }

        function drawDuskKeep(x, baseY) {
          ctx.save();
          ctx.fillStyle = LS_THEME.duskHillFar;
          ctx.fillRect(x + 16, baseY - 26, 34, 30);
          for (let i = 0; i < 3; i++) ctx.fillRect(x + 18 + i * 12, baseY - 32, 7, 7);
          for (const tx of [x, x + 52]) {
            ctx.fillRect(tx, baseY - 40, 14, 44);
            ctx.beginPath();
            ctx.moveTo(tx - 3, baseY - 40);
            ctx.lineTo(tx + 7, baseY - 56);
            ctx.lineTo(tx + 17, baseY - 40);
            ctx.closePath();
            ctx.fill();
          }
          ctx.fillStyle = "rgba(255,206,120,0.55)";
          ctx.fillRect(x + 30, baseY - 18, 5, 6);
          ctx.fillRect(x + 4, baseY - 30, 4, 5);
          ctx.restore();
        }

        // The cliff faces are what turn a tile field into an object: land with a
        // front edge, a shadow, and somewhere it stops.
        function drawIslandCliff(screen) {
          const hw = LS_MAP.tileW / 2;
          const hh = LS_MAP.tileH / 2;
          const d = LS_MAP.cliffDepth;
          ctx.fillStyle = LS_THEME.soilTop;
          ctx.beginPath();
          ctx.moveTo(screen.x - hw, screen.y);
          ctx.lineTo(screen.x, screen.y + hh);
          ctx.lineTo(screen.x + hw, screen.y);
          ctx.lineTo(screen.x + hw, screen.y + 7);
          ctx.lineTo(screen.x, screen.y + hh + 7);
          ctx.lineTo(screen.x - hw, screen.y + 7);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = LS_THEME.soilFace;
          ctx.beginPath();
          ctx.moveTo(screen.x - hw, screen.y);
          ctx.lineTo(screen.x, screen.y + hh);
          ctx.lineTo(screen.x, screen.y + hh + d);
          ctx.lineTo(screen.x - hw, screen.y + d);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = LS_THEME.soilSide;
          ctx.beginPath();
          ctx.moveTo(screen.x + hw, screen.y);
          ctx.lineTo(screen.x, screen.y + hh);
          ctx.lineTo(screen.x, screen.y + hh + d);
          ctx.lineTo(screen.x + hw, screen.y + d);
          ctx.closePath();
          ctx.fill();
        }

        function drawLevelSelectGround() {
          const center = worldToGrid(levelSelectCamera.x, levelSelectCamera.y);
          const gx0 = Math.floor(center.gx) - 10;
          const gx1 = Math.ceil(center.gx) + 10;
          const gy0 = Math.floor(center.gy) - 10;
          const gy1 = Math.ceil(center.gy) + 10;
          const tiles = [];
          for (let gx = gx0; gx <= gx1; gx++) {
            for (let gy = gy0; gy <= gy1; gy++) {
              if (!isIslandTile(gx, gy)) continue;
              const world = isoToWorld(gx, gy);
              const screen = worldToScreen(world.x, world.y);
              if (
                screen.x < -160 ||
                screen.x > W + 160 ||
                screen.y < -140 ||
                screen.y > H + 160
              )
                continue;
              tiles.push({ gx, gy, screen, sort: world.y });
            }
          }
          tiles.sort((a, b) => a.sort - b.sort);

          if (tiles.length) {
            let minX = Infinity,
              maxX = -Infinity,
              maxY = -Infinity;
            for (const t of tiles) {
              minX = Math.min(minX, t.screen.x);
              maxX = Math.max(maxX, t.screen.x);
              maxY = Math.max(maxY, t.screen.y);
            }
            const cx = (minX + maxX) / 2;
            const rx = (maxX - minX) / 2 + 120;
            const cy = maxY + LS_MAP.cliffDepth + 18;
            const ry = 74;
            ctx.save();
            ctx.translate(cx, cy);
            ctx.scale(1, ry / rx);
            const shadow = ctx.createRadialGradient(0, 0, rx * 0.25, 0, 0, rx);
            shadow.addColorStop(0, "rgba(8,4,18,0.55)");
            shadow.addColorStop(1, "rgba(8,4,18,0)");
            ctx.fillStyle = shadow;
            ctx.beginPath();
            ctx.arc(0, 0, rx, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }

          for (const t of tiles) {
            const front =
              !isIslandTile(t.gx + 1, t.gy) || !isIslandTile(t.gx, t.gy + 1);
            if (front) drawIslandCliff(t.screen);
            if (forestSheetReady) {
              lsDrawAtlasFrame(
                lsGroundFrame(t.gx, t.gy),
                t.screen.x,
                t.screen.y + 12,
                LS_MAP.groundTileW,
                0.55,
                1,
                "saturate(0.9) contrast(1.02) brightness(0.94)",
              );
            } else {
              const alt = ((t.gx + t.gy) & 1) === 0;
              drawIsoDiamondTile(
                t.screen,
                alt ? "#659c52" : LS_THEME.groundDark,
              );
            }
          }
        }

        function drawLevelSelectVignette() {
          const v = ctx.createRadialGradient(
            W / 2,
            H / 2,
            H * 0.42,
            W / 2,
            H / 2,
            W * 0.72,
          );
          v.addColorStop(0, "rgba(10,5,20,0)");
          v.addColorStop(1, "rgba(10,5,20,0.55)");
          ctx.fillStyle = v;
          ctx.fillRect(0, 0, W, H);
        }
